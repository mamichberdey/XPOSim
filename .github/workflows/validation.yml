name: Numerical validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy scipy pytest pytest-cov ruff
      - name: Lint the physical reference suite
        run: python -m ruff check --isolated tests/test_physics_validation.py
      - name: Run CPU regressions and physical references
        run: python -m pytest tests --cov=XPOSim --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml

  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare build tools and existing numerical environment
        run: python -m pip install build setuptools wheel numpy ruff
      - name: Lint distribution checks
        run: python -m ruff check --isolated tests/check_distribution.py
      - name: Build source archive and wheel
        run: python -m build
      - name: Prepare NumPy-only test environment wheel
        run: python -m pip download --only-binary=:all: --no-deps numpy --dest build/runtime-wheels
      - name: Verify offline installation and NumPy-only calculations
        run: python tests/check_distribution.py dist build/runtime-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
