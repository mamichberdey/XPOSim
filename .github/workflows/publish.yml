name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a release commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation and build tools
        run: python -m pip install 'setuptools>=77.0.3' wheel numpy scipy pytest ruff build twine
      - name: Check tag and licensing metadata
        run: python tools/check_release.py "$GITHUB_REF_NAME"
      - name: Lint release and numerical checks
        run: python -m ruff check --isolated tools/check_release.py tests/test_release_metadata.py tests/check_distribution.py tests/test_physics_validation.py tests/test_numerical_stability.py tests/test_focus_reliability.py
      - name: Run numerical and packaging regressions
        run: python -m pytest tests
      - name: Build distributions once
        run: python -m build
      - name: Check PyPI metadata and README rendering
        run: python -m twine check --strict dist/*
      - name: Prepare offline NumPy wheel
        run: >-
          python -m pip download --only-binary=:all: --no-deps numpy --dest build/runtime-wheels
      - name: Verify installation and dependency preservation
        run: python tests/check_distribution.py dist build/runtime-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/XPOSim
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish verified artifacts with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
